name: Build APK

# Manual trigger only. Building on every push would burn CI minutes for no
# benefit while the project has no automated device tests to gate on.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the APKs to a prerelease so a phone can download them directly"
        type: boolean
        default: true

permissions:
  contents: write # required to create the prerelease that carries the APKs

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK packages this project needs
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Platforms are minor-versioned now: android-37.0, not android-37.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build debug APKs, split per ABI
        # Per-ABI keeps the phone download at ~35MB rather than ~64MB.
        run: ./gradlew :app:assembleDebug -PabiSplits --no-daemon --stacktrace

      - name: Report artifact sizes
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APKs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelfie-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish a prerelease carrying the APKs
        if: ${{ inputs.publish_release }}
        env:
          # Only the token is exposed, deliberately scoped to this step.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="debug-$(date -u +%Y%m%d-%H%M%S)"

          cat > notes.md <<'NOTES'
          Debug build of Shelfie, for installing on a phone.

          **Which file do I want?**

          | File | Use it if |
          |---|---|
          | `app-arm64-v8a-debug.apk` | Almost every phone from the last several years. **Start here.** |
          | `app-armeabi-v7a-debug.apk` | Older or very low-end 32-bit devices |
          | `app-universal-debug.apk` | Fallback if neither of the above installs |

          **Installing:** open this page in your phone's browser, download the APK,
          tap it, and allow installing from your browser when prompted.

          Requires **Android 8.0 or newer**. Installs alongside anything else as
          `com.shelfie.app.debug`.

          These are debug builds: unminified, with logging enabled, and larger than
          the real thing. Play would deliver about 7.3 MB.

          **In-app purchases will not work here** — Play Billing requires a release
          build installed by the Play Store. The app runs at the free tier instead,
          which is the correct fallback.

          What to check first, in priority order:
          `docs/08-run-on-device.md`
          NOTES

          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
            app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk \
            app/build/outputs/apk/debug/app-universal-debug.apk \
            --title "Shelfie debug build ($TAG)" \
            --notes-file notes.md \
            --prerelease

          echo "Release page: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK packages this project needs
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Lint
        # HardcodedText and the accessibility checks are errors, so this gate is
        # what keeps the localisation work from regressing.
        run: ./gradlew :app:lintRelease --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          retention-days: 7
